services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: students
      POSTGRES_PASSWORD: students_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U students -d students"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://students:students_dev_password@db:5432/students
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  reports:
    build: ./report-service
    environment:
      MAIN_SERVICE_URL: http://backend:8000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8001"
    depends_on:
      - backend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - reports
volumes:
  postgres_data:
